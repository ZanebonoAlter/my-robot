name: Test

on:
  push:
    branches: [main, v*]
  pull_request:
    branches: [main, v*]

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run unit tests
        run: go test -short ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      # Integration tests start their own isolated pgvector Postgres via
      # testcontainers-go (see backend-go/internal/platform/testutil). No
      # service container or TEST_DB_DSN is needed — and deliberately none is
      # used: testutil has no default DSN and reads no env var, so it can
      # never reach anything other than its throwaway container.
      - name: Run integration tests
        run: go test ./...
